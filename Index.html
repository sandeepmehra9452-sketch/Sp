<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SignageStore — Admin Panel</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --side:#0d1b2a; --side2:#122639; --side-line:rgba(255,255,255,.07);
  --bg:#f3f6fb; --card:#ffffff; --ink:#0f1c2e; --muted:#6b7a90; --line:#e6ecf4;
  --blue:#2563eb; --blue-d:#1d4ed8; --blue-bg:#eaf1fe;
  --green:#16a34a; --green-bg:#e8f7ee; --red:#dc2626; --red-bg:#fdecec;
  --amber:#d97706; --amber-bg:#fdf3e3; --purple:#7c3aed; --purple-bg:#f1eafe;
  --teal:#0d9488; --teal-bg:#e6f6f4; --cyan:#0891b2; --cyan-bg:#e5f6fb;
  --radius:14px; --shadow:0 1px 3px rgba(15,28,46,.06),0 8px 24px rgba(15,28,46,.05);
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 Inter,Arial,sans-serif;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--blue)}
h1,h2,h3{margin:0}

/* ---------- Login ---------- */
.login{min-height:100vh;min-height:100dvh;display:grid;place-items:center;padding:24px;background:radial-gradient(900px 500px at 20% -10%,#1e3a5f,#0d1b2a 60%)}
.lbox{width:min(400px,100%);background:#fff;border-radius:18px;padding:34px 30px;box-shadow:0 24px 60px rgba(0,0,0,.4)}
.lmark{width:78px;height:78px;display:grid;place-items:center;margin-bottom:18px}
.lmark img{width:100%;height:100%;object-fit:contain}
.lbox h1{font-size:22px;margin-bottom:2px}
.muted{color:var(--muted)}
label{display:block;margin:15px 0 6px;font-weight:600;font-size:12.5px;color:#33415c}
input,select,textarea{width:100%;padding:10px 13px;border:1px solid #d7e0ec;border-radius:10px;background:#fff;outline:none;transition:border-color .15s}
input:focus,select:focus,textarea:focus{border-color:var(--blue);box-shadow:0 0 0 3px rgba(37,99,235,.12)}
textarea{min-height:90px;resize:vertical}
.btn{border:0;border-radius:10px;padding:10px 16px;font-weight:600;display:inline-flex;align-items:center;gap:8px}
.btn-p{background:var(--blue);color:#fff}.btn-p:hover{background:var(--blue-d)}
.btn-p:disabled{opacity:.55;cursor:default}
.btn-o{background:#fff;border:1px solid var(--line);color:var(--ink)}
.btn-o:hover{border-color:#c6d4e6}
.btn-danger{background:var(--red-bg);color:var(--red);border:1px solid #f3c8c8}
.btn-block{width:100%;justify-content:center;margin-top:20px}
.err{color:var(--red);margin-top:12px;font-size:13px;min-height:1em}

/* ---------- Shell ---------- */
.app{display:none;min-height:100vh;min-height:100dvh}
.sidebar{position:fixed;top:0;left:0;bottom:0;width:250px;max-width:82vw;background:linear-gradient(180deg,var(--side),var(--side2));z-index:100;display:flex;flex-direction:column;transition:transform .25s}
.brand{display:flex;align-items:center;gap:11px;padding:18px 18px 16px;border-bottom:1px solid var(--side-line)}
.bmark{width:42px;height:42px;display:grid;place-items:center;flex:none}
.bmark img{width:100%;height:100%;object-fit:contain}
.bname{color:#fff;font-weight:700;font-size:15.5px;line-height:1.2}
.bsub{color:#8fa3bd;font-size:11px}
.snav{flex:1;overflow-y:auto;padding:12px 12px 8px}
.nitem{display:flex;align-items:center;gap:11px;width:100%;text-align:left;background:none;border:0;color:#b8c6da;padding:10px 12px;border-radius:10px;margin:2px 0;font-weight:500;font-size:13.5px}
.nitem svg{width:18px;height:18px;flex:none}
.nitem:hover{background:rgba(255,255,255,.06);color:#fff}
.nitem.active{background:var(--blue);color:#fff;font-weight:600}
.nitem .nbadge{margin-left:auto;background:var(--red);color:#fff;font-size:10.5px;font-weight:700;border-radius:9px;padding:1px 7px}
.nitem .caret{margin-left:auto;transition:transform .2s}
.nitem.open .caret{transform:rotate(180deg)}
.nsub{display:none;margin:2px 0 4px 0}
.nsub.open{display:block}
.nsub .nitem{padding-left:41px;font-size:13px}
.sidebar-close{
  display:none;background:rgba(255,255,255,.08);border:0;color:#fff;
  width:34px;height:34px;border-radius:9px;font-size:20px;line-height:1;
  align-items:center;justify-content:center;padding:0;flex:none;cursor:pointer;
}
.sidebar-close:hover{background:rgba(255,255,255,.15)}
.sidebar-backdrop{
  display:none;position:fixed;inset:0;background:rgba(13,27,42,.55);
  z-index:99;opacity:0;transition:opacity .25s;
}
.sidebar-backdrop.show{display:block;opacity:1}
.sfoot{padding:14px;border-top:1px solid var(--side-line)}
.online{background:rgba(255,255,255,.05);border:1px solid var(--side-line);border-radius:12px;padding:12px 14px;color:#fff;font-size:13px;font-weight:600;display:flex;align-items:center;gap:8px}
.online small{display:block;color:#8fa3bd;font-weight:400;font-size:11px;margin-top:2px}
.dot{width:8px;height:8px;border-radius:50%;background:#22c55e;box-shadow:0 0 0 4px rgba(34,197,94,.18);flex:none}

.main{margin-left:250px;min-height:100vh;min-height:100dvh;display:flex;flex-direction:column}
.topbar{height:62px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:14px;padding:0 22px;position:sticky;top:0;z-index:30}
.hamb{width:38px;height:38px;border:0;background:none;border-radius:9px;display:grid;place-items:center;color:#41506b}
.hamb:hover{background:#f1f5fb}
.gsearch{flex:1;max-width:520px;position:relative}
.gsearch input{background:#f3f6fb;border:1px solid transparent;border-radius:10px;padding:9px 14px 9px 38px;font-size:13.5px}
.gsearch input:focus{background:#fff;border-color:var(--blue)}
.gsearch svg{position:absolute;left:12px;top:50%;margin-top:-8px;width:16px;height:16px;color:#8aa0bd}
.tbtn{position:relative;width:38px;height:38px;border:0;background:none;border-radius:9px;display:grid;place-items:center;color:#41506b}
.tbtn:hover{background:#f1f5fb}
.tbtn svg{width:19px;height:19px}
.tbadge{position:absolute;top:2px;right:2px;min-width:16px;height:16px;border-radius:8px;background:var(--red);color:#fff;font-size:9.5px;font-weight:700;display:grid;place-items:center;padding:0 4px}
.prow{display:flex;align-items:center;gap:10px;cursor:pointer;padding:5px 8px;border-radius:10px}
.prow:hover{background:#f1f5fb}
.pav{width:34px;height:34px;border-radius:50%;background:linear-gradient(135deg,#2563eb,#7c3aed);color:#fff;display:grid;place-items:center;font-weight:700;font-size:13px}
.pname{font-weight:600;font-size:13px;line-height:1.2}
.prole{font-size:11px;color:var(--muted)}

.content{padding:24px 26px 40px;flex:1;min-width:0}
.phead{display:flex;align-items:flex-start;justify-content:space-between;gap:14px;margin-bottom:18px;flex-wrap:wrap}
.phead h1{font-size:24px;font-weight:800;letter-spacing:-.3px}
.phead .psub{color:var(--muted);margin-top:3px;font-size:13.5px}

/* dropdowns */
.dd{position:relative}
.ddmenu{display:none;position:absolute;right:0;top:calc(100% + 8px);background:#fff;border:1px solid var(--line);border-radius:12px;box-shadow:0 16px 40px rgba(15,28,46,.16);min-width:230px;max-width:calc(100vw - 24px);z-index:60;overflow:hidden}
@media(max-width:420px){.ddmenu{position:fixed;left:12px;right:12px;top:60px;width:auto;min-width:0}}
.ddmenu.on{display:block}
.dditem{display:flex;gap:10px;align-items:flex-start;width:100%;text-align:left;background:none;border:0;padding:11px 14px;border-bottom:1px solid #f0f4fa;font-size:13px}
.dditem:hover{background:#f6f9fd}
.dditem:last-child{border-bottom:0}
.ddhead{padding:10px 14px;font-weight:700;font-size:12.5px;border-bottom:1px solid #f0f4fa;display:flex;justify-content:space-between;align-items:center}
.ddhead button{border:0;background:none;color:var(--blue);font-size:12px;font-weight:600}
.unread-dot{width:8px;height:8px;border-radius:50%;background:var(--blue);flex:none;margin-top:5px}
.ntitle{font-weight:600;font-size:12.5px;line-height:1.35}
.ntime{color:var(--muted);font-size:11px;margin-top:2px}
.nic{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;flex:none}
.nic svg{width:17px;height:17px}
.nic.order{background:var(--blue-bg);color:var(--blue)}
.nic.quote{background:var(--cyan-bg);color:var(--cyan)}
.nic.review{background:var(--amber-bg);color:var(--amber)}
.nic.comment{background:var(--purple-bg);color:var(--purple)}
.nic.default{background:#eef2f8;color:#5b6b84}
.dditem.unread{background:#f5f9ff}
.dditem .unread-dot{margin-top:14px}
.pmenu-item{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:none;border:0;padding:11px 14px;font-size:13px;font-weight:500}
.pmenu-item:hover{background:#f6f9fd}
.pmenu-item.red{color:var(--red)}

/* ---------- Cards / stats ---------- */
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;margin-bottom:18px}
.scard{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:16px 18px;display:flex;align-items:center;gap:14px;box-shadow:var(--shadow)}
.sic{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;flex:none}
.sic svg{width:21px;height:21px}
.sic.b{background:var(--blue-bg);color:var(--blue)}
.sic.g{background:var(--green-bg);color:var(--green)}
.sic.a{background:var(--amber-bg);color:var(--amber)}
.sic.p{background:var(--purple-bg);color:var(--purple)}
.sic.t{background:var(--teal-bg);color:var(--teal)}
.sic.c{background:var(--cyan-bg);color:var(--cyan)}
.sic.r{background:var(--red-bg);color:var(--red)}
.slabel{color:var(--muted);font-size:12.5px;font-weight:500}
.snum{font-size:24px;font-weight:800;letter-spacing:-.5px;margin-top:1px}

.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}
.cardpad{padding:18px 20px}
.ctitle{font-weight:700;font-size:15px;margin-bottom:12px}

/* ---------- Toolbar / filters ---------- */
.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.toolbar input,.toolbar select{width:auto;max-width:260px}
.tsearch{position:relative}
.tsearch input{padding-left:34px;min-width:240px}
.tsearch svg{position:absolute;left:11px;top:50%;margin-top:-7px;width:14px;height:14px;color:#8aa0bd}

/* ---------- Table ---------- */
.tablewrap{overflow:auto}
table{width:100%;border-collapse:collapse;min-width:640px}
th,td{padding:12px 14px;border-bottom:1px solid #eef2f8;text-align:left;vertical-align:middle;font-size:13.5px}
th{background:#f8fafd;color:#7185a1;font-weight:600;font-size:11.5px;letter-spacing:.04em;text-transform:uppercase}
tr:last-child td{border-bottom:0}
tbody tr:hover{background:#f8fbff}
.tthumb{width:46px;height:46px;border-radius:9px;object-fit:cover;background:#e8eef6;display:block}
.ttitle{font-weight:600;font-size:13.5px}
.tsub{color:var(--muted);font-size:12px;margin-top:1px}
.pill{display:inline-block;padding:4px 11px;border-radius:99px;font-size:11.5px;font-weight:600;white-space:nowrap}
.pill.ok{background:var(--green-bg);color:var(--green)}
.pill.off{background:#eef2f7;color:#7d8ea6}
.pill.warn{background:var(--amber-bg);color:var(--amber)}
.pill.bad{background:var(--red-bg);color:var(--red)}
.pill.info{background:var(--blue-bg);color:var(--blue)}
.pill.pu{background:var(--purple-bg);color:var(--purple)}
.pill.te{background:var(--teal-bg);color:var(--teal)}
.pill.cy{background:var(--cyan-bg);color:var(--cyan)}
.act{display:inline-flex;gap:7px}
.ibtn{width:32px;height:32px;border:0;border-radius:9px;display:grid;place-items:center}
.ibtn svg{width:15px;height:15px}
.ibtn.v{background:var(--blue);color:#fff}
.ibtn.e{background:var(--blue-bg);color:var(--blue)}
.ibtn.d{background:var(--red);color:#fff}
.ibtn:hover{filter:brightness(.94)}
.chk{width:16px;height:16px;accent-color:var(--blue)}
.tfoot{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 14px;flex-wrap:wrap}
.tfoot .muted{font-size:12.5px}
.pager{display:flex;gap:5px}
.pager button{width:30px;height:30px;border:1px solid var(--line);background:#fff;border-radius:8px;font-size:12.5px;font-weight:600;color:#41506b}
.pager button.cur{background:var(--blue);border-color:var(--blue);color:#fff}
.pager button:disabled{opacity:.4;cursor:default}
.empty{padding:44px 20px;text-align:center;color:var(--muted)}
.empty svg{width:38px;height:38px;color:#c4d2e4;margin-bottom:8px}

/* ---------- Split layout (table + preview) ---------- */
.split{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:16px;align-items:start}
@media(max-width:1100px){.split{grid-template-columns:minmax(0,1fr)}.preview{display:none}}
.preview{position:sticky;top:78px}
.pv-img{width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:12px;background:#e8eef6;display:block}
.pv-title{font-weight:700;font-size:16px;margin:12px 0 8px;display:flex;justify-content:space-between;gap:8px;align-items:center}
.pv-meta{display:flex;flex-direction:column;gap:9px;margin:12px 0}
.pv-row{display:flex;align-items:center;gap:10px;font-size:13px}
.pv-row svg{width:15px;height:15px;color:#8aa0bd;flex:none}
.pv-row .k{color:var(--muted);width:92px;flex:none}
.pv-row .v{font-weight:600}
.qa{display:flex;flex-direction:column;gap:9px;margin-top:6px}
.qa .btn{justify-content:center;width:100%}
.tips{margin-top:14px;background:#f6f9ff;border:1px solid #dfe9fb;border-radius:12px;padding:13px 15px}
.tips b{font-size:13px;display:flex;gap:7px;align-items:center}
.tips p{margin:6px 0 0;color:var(--muted);font-size:12.5px}
.hr{border:0;border-top:1px solid #eef2f8;margin:14px 0}

/* ---------- Tabs ---------- */
.tabs{display:flex;gap:6px;margin-bottom:14px;border-bottom:1px solid var(--line)}
.tab{border:0;background:none;padding:9px 15px;font-weight:600;font-size:13.5px;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px}
.tab.on{color:var(--blue);border-bottom-color:var(--blue)}

/* ---------- Modal ---------- */
.modal{display:none;position:fixed;inset:0;background:rgba(13,27,42,.5);place-items:center;padding:18px;z-index:80;overflow:auto}
.modal.on{display:grid}
.mbox{background:#fff;width:min(680px,100%);max-height:88vh;overflow:auto;border-radius:16px;padding:24px;box-shadow:0 24px 60px rgba(0,0,0,.3)}
.mbox h2{font-size:19px;margin-bottom:4px}
.mactions{display:flex;gap:9px;justify-content:flex-end;margin-top:20px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}
.msec{grid-column:1/-1;font-weight:700;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:#7185a1;margin:8px 0 0;padding-top:10px;border-top:1px solid #eef2f8}
.checks{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:7px;max-height:210px;overflow:auto;padding:2px}
.check{border:1px solid var(--line);padding:7px 9px;border-radius:8px;font-size:12px;display:flex;gap:7px;align-items:center;margin:0;font-weight:500;color:#33415c}

/* dropzone */
.dropzone{border:2px dashed #cdd9e8;border-radius:12px;padding:18px;text-align:center;color:var(--muted);cursor:pointer;font-size:13px;transition:.15s}
.dropzone:hover,.dropzone.drag{border-color:var(--blue);background:var(--blue-bg)}
.imgpreview{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.imgpreview .ph{position:relative;width:70px;height:70px}
.imgpreview img{width:70px;height:70px;object-fit:cover;border-radius:9px;border:1px solid var(--line)}
.imgpreview .rm{position:absolute;top:-6px;right:-6px;width:20px;height:20px;border-radius:50%;background:var(--red);color:#fff;border:2px solid #fff;font-size:12px;display:grid;place-items:center;padding:0}
.uploadhint{font-size:12px;color:var(--muted);margin-top:6px}

/* ---------- Dashboard order cards ---------- */
.ordcards{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:12px;align-items:start}
@media(max-width:640px){.ordcards{grid-template-columns:minmax(0,1fr)}}
.ordcard{border:1px solid var(--line);border-radius:14px;padding:14px 16px;transition:.15s}
.ordcard:hover{border-color:#cdd9e8;box-shadow:0 4px 14px rgba(20,40,70,.06)}
.ordcard-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;flex-wrap:wrap}
.ordcard-id{font-weight:700;font-size:14px}
.ordcard-date{color:var(--muted);font-size:12px;margin-top:1px}
.ordcard-body{display:grid;grid-template-columns:minmax(0,1fr) 84px;gap:14px;margin-top:10px;align-items:start}
.ordcard-info{display:flex;flex-direction:column;gap:4px;font-size:13px;min-width:0}
.ordcard-info .nm{font-weight:600}
.ordcard-info .muted2{color:var(--muted);font-size:12.5px}
.ordcard-addr{display:flex;gap:6px;align-items:flex-start;color:#41506b;font-size:12.5px;margin-top:2px}
.ordcard-addr svg{width:13px;height:13px;color:#8aa0bd;flex:none;margin-top:2px}
.ordcard-imgs{display:flex;gap:6px;flex-wrap:wrap;justify-self:end}
.ordcard-imgs img{width:38px;height:38px;object-fit:cover;border-radius:8px;border:1px solid var(--line);cursor:pointer}
.ordcard-noimg{width:38px;height:38px;border-radius:8px;background:#f1f5fa;display:grid;place-items:center;color:#b7c4d8}
.ordcard-noimg svg{width:16px;height:16px}
.ordcard-foot{display:flex;justify-content:space-between;align-items:center;margin-top:10px;gap:10px}

/* ---------- Toast ---------- */
.toasts{position:fixed;bottom:20px;right:20px;z-index:99;display:flex;flex-direction:column;gap:8px}
.toast{background:#10233a;color:#fff;padding:12px 16px;border-radius:11px;font-size:13px;font-weight:500;box-shadow:0 12px 30px rgba(0,0,0,.3);display:flex;gap:9px;align-items:center;animation:tin .25s}
.toast.ok{border-left:4px solid #22c55e}.toast.err{border-left:4px solid #ef4444}
@keyframes tin{from{transform:translateY(10px);opacity:0}}

/* ---------- Chart ---------- */
.chartbox{padding:16px 18px}
canvas.chart{width:100%;height:220px}
.barrow{display:flex;align-items:center;gap:10px;margin:7px 0;font-size:12.5px}
.barrow .k{width:90px;color:var(--muted);flex:none}
.bartrack{flex:1;height:9px;background:#eef2f8;border-radius:99px;overflow:hidden}
.barfill{height:100%;background:var(--blue);border-radius:99px}
.barrow .v{width:40px;text-align:right;font-weight:700;flex:none}

/* ---------- Responsive ---------- */
@media(max-width:900px){
  .sidebar{transform:translateX(-102%)}
  body.sopen .sidebar{transform:none}
  .sidebar-close{display:flex}
  .main{margin-left:0}
  .main,.content{max-width:100vw}
  .stats{grid-template-columns:repeat(2,minmax(0,1fr))}
  .content{padding:16px 14px 34px}
  .row2,.row3{grid-template-columns:minmax(0,1fr)}
  .split{grid-template-columns:minmax(0,1fr)!important}
  .preview{display:none}
  .gsearch{max-width:none}
  .prow .pmeta{display:none}
}
@media(max-width:520px){.stats{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.scard{padding:12px}.snum{font-size:19px}.sic{width:36px;height:36px}.sic svg{width:17px;height:17px}}
html,body{overflow-x:hidden;max-width:100%;overscroll-behavior-y:none;-webkit-overflow-scrolling:touch}
.snav,.content,.tablewrap,.mbox{-webkit-overflow-scrolling:touch}

/* ---- added: hints, viewer, category actions ---- */
.hint{font-size:11.5px;color:var(--muted);margin-top:4px}
.ibtn[disabled]{cursor:default}
.act{flex-wrap:wrap}
.imgv{position:fixed;inset:0;z-index:9999;background:#0b1220;display:flex;flex-direction:column;color:#fff}
.imgv-bar{display:flex;align-items:center;gap:10px;padding:calc(10px + env(safe-area-inset-top,0px)) 12px 10px;background:rgba(255,255,255,.06);border-bottom:1px solid rgba(255,255,255,.08)}
.imgv-back{border:0;background:#2563eb;color:#fff;border-radius:10px;padding:9px 16px;font-weight:600;font-size:14px}
.imgv-title{flex:1;font-weight:600;font-size:14px;opacity:.9;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.imgv-tools{display:flex;align-items:center;gap:8px}
.imgv-tools button{width:36px;height:36px;border-radius:10px;border:1px solid rgba(255,255,255,.2);background:rgba(255,255,255,.08);color:#fff;font-size:20px;line-height:1;padding:0}
.imgv-pct{min-width:44px;text-align:center;font-size:12.5px;opacity:.85}
.imgv-stage{flex:1;min-height:0;display:grid;place-items:center;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none}
.imgv-img{max-width:min(86vw,560px);max-height:56vh;object-fit:contain;border-radius:12px;background:#111a2b;box-shadow:0 12px 40px rgba(0,0,0,.5);transform-origin:50% 50%;will-change:transform;cursor:zoom-in;-webkit-user-drag:none}
.imgv-img.zoomed{cursor:grab}
.imgv-foot{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 14px calc(12px + env(safe-area-inset-bottom,0px));font-size:12.5px;opacity:.85}
.imgv-foot a{color:#9ec1ff}
</style>
</head>

async function api(action, payload={}){

  return j;
}
function esc(x){ return String(x ?? '').replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])); }
function can(p){ return me?.role==='SUPER_ADMIN' || (me?.permissions||[]).includes(p); }
function fmtDate(s){ if(!s) return '—'; try{ return new Date(s).toLocaleString('en-IN',{day:'numeric',month:'short',year:'numeric',hour:'2-digit',minute:'2-digit'}); }catch(e){ return s; } }
function fmtDay(s){ if(!s) return '—'; try{ return new Date(s).toLocaleDateString('en-IN',{day:'numeric',month:'short',year:'numeric'}); }catch(e){ return s; } }
function fmtDateTime(s){ if(!s) return '—'; try{ const d=new Date(s); return d.toLocaleDateString('en-IN',{day:'numeric',month:'short',year:'numeric'})+' · '+d.toLocaleTimeString('en-IN',{hour:'numeric',minute:'2-digit',hour12:true}); }catch(e){ return s; } }
function parseImages(v){ if(Array.isArray(v)) return v; if(typeof v==='string'){ try{ const p=JSON.parse(v); return Array.isArray(p)?p:[]; }catch(e){ return []; } } return []; }
function driveThumb(u,sz){ var m=String(u||'').match(/\/d\/([a-zA-Z0-9_-]+)/); return m?('https://drive.google.com/thumbnail?id='+m[1]+'&sz='+(sz||'w200')):u; }
function imgErr(el){ var p=el.closest('.ordcard-imgs'); if(p) p.innerHTML='<div class="ordcard-noimg">'+ic('image')+'</div>'; else el.style.display='none'; }
function addrLine(o){ return [o.address,o.city,o.district,o.state,o.pincode,o.country].map(x=>String(x||'').trim()).filter(Boolean).join(', '); }
function money(n){ const x = Number(n||0); return '₹' + x.toLocaleString('en-IN'); }
function todayISO(){ return new Date().toISOString().slice(0,10); }
function toast(msg, type='ok'){ const t=document.createElement('div'); t.className='toast '+type; t.textContent=msg; document.getElementById('toasts').appendChild(t); setTimeout(()=>t.remove(), 3500); }
function debounce(fn, ms){ let t; return function(...a){ clearTimeout(t); t=setTimeout(()=>fn.apply(this,a), ms); }; }
function catPill(cat){
  const palette=['info','pu','te','cy','warn','bad','ok','off'];
  let h=0; for(const ch of String(cat||'?')) h=(h*31+ch.charCodeAt(0))>>>0;
  return '<span class="pill '+palette[h%palette.length]+'">'+esc(cat||'—')+'</span>';
}
function statusPill(s){
  s=String(s||'');
  if(['Active','Available','ACTIVE','APPROVED','Delivered','Closed'].includes(s)) return '<span class="pill ok">'+esc(s)+'</span>';
  if(['Inactive','Unavailable','INACTIVE','HIDDEN','Cancelled'].includes(s)) return '<span class="pill bad">'+esc(s)+'</span>';
  if(['Pending','PENDING','Processing','New','Contacted'].includes(s)) return '<span class="pill warn">'+esc(s)+'</span>';
  return '<span class="pill info">'+esc(s)+'</span>';
}
function stars(n){ n=Math.round(Number(n||0)); let o=''; for(let i=1;i<=5;i++) o+= i<=n?'★':'☆'; return '<span style="color:var(--amber);letter-spacing:2px">'+o+'</span>'; }
function emptyBox(msg){ return '<div class="empty">'+ic('box')+'<div>'+esc(msg)+'</div></div>'; }
function pageArr(arr, key, per=8){
  const p = S.page[key] || 1;
  const total = arr.length, pages = Math.max(1, Math.ceil(total/per));
  const cur = Math.min(p, pages);
  return { rows: arr.slice((cur-1)*per, cur*per), cur, pages, total, per,
    from: total? (cur-1)*per+1 : 0, to: Math.min(cur*per, total) };
}
function pagerHtml(pg, key){
  let btns='';
  for(let i=1;i<=pg.pages;i++){
    if(pg.pages>7 && i>2 && i<pg.pages-1 && Math.abs(i-pg.cur)>1){ if(i===3) btns+='<button disabled>…</button>'; continue; }
    btns+='<button class="'+(i===pg.cur?'cur':'')+'" onclick="setPage(\''+key+'\','+i+')">'+i+'</button>';
  }
  return '<div class="tfoot"><span class="muted">Showing '+pg.from+' to '+pg.to+' of '+pg.total+' entries</span>'+
    '<div class="pager"><button '+(pg.cur<=1?'disabled':'')+' onclick="setPage(\''+key+'\','+(pg.cur-1)+')">‹</button>'+btns+
    '<button '+(pg.cur>=pg.pages?'disabled':'')+' onclick="setPage(\''+key+'\','+(pg.cur+1)+')">›</button></div></div>';
}
function setPage(key, p){ S.page[key]=p; rerender(); }

      '<button class="nitem'+(S.sec===c.id?' active':'')+'" data-nav="'+c.id+'"><span>'+c.label+'</span></button>').join('')+'</div>';

/* ================= SECTION ROUTER ================= */
const BUILDERS = {};
function go(sec){

}

function go2_keep(){

async function loadSection(sec, soft){

/* ================= IMAGE UPLOAD WIDGET ================= */
function imageUploadWidget(existing, label){
  const state = { images: (existing||[]).slice() };
  const id = 'iw_' + Math.random().toString(36).slice(2);
  window.__imgStates = window.__imgStates || {};
  window.__imgStates[id] = state;
  setTimeout(()=>wireImageWidget(id, state), 0);
  return { html: '<label>'+(label||'Photos')+'</label>'+
    '<div class="dropzone" id="'+id+'_drop">Tap to choose photos from your gallery or computer, or drop them here</div>'+
    '<input type="file" id="'+id+'_file" accept="image/*" multiple style="display:none">'+
    '<div class="imgpreview" id="'+id+'_preview"></div>'+
    '<div class="uploadhint" id="'+id+'_hint"></div>', state };
}
function wireImageWidget(id, state){
  const drop=document.getElementById(id+'_drop'); if(!drop) return;
  const file=document.getElementById(id+'_file'), preview=document.getElementById(id+'_preview'), hint=document.getElementById(id+'_hint');
  function render(){
    preview.innerHTML = state.images.map((u,i)=>'<div class="ph"><img src="'+esc(u)+'">'+(i===0?'<span style="position:absolute;bottom:3px;left:3px;background:#2563eb;color:#fff;font-size:9px;padding:1px 6px;border-radius:6px">MAIN</span>':'')+'<button type="button" class="rm" data-i="'+i+'">×</button></div>').join('');
    preview.querySelectorAll('.rm').forEach(b=>b.onclick=()=>{ state.images.splice(+b.dataset.i,1); render(); });
  }
  render();
  drop.onclick=()=>file.click();
  drop.ondragover=e=>{e.preventDefault();drop.classList.add('drag');};
  drop.ondragleave=()=>drop.classList.remove('drag');
  drop.ondrop=e=>{e.preventDefault();drop.classList.remove('drag');handle(e.dataTransfer.files);};
  file.onchange=()=>handle(file.files);
  async function handle(fl){
    const files=Array.from(fl||[]); if(!files.length) return;
    hint.textContent='Uploading '+files.length+' photo(s)...';
    for(const f of files){
      try{
        const dataUrl=await new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(r.result);r.onerror=rej;r.readAsDataURL(f);});
        const resp=await api('media.upload',{data:dataUrl,filename:f.name});
        state.images.push(resp.url); render();
      }catch(e){ hint.textContent='Upload failed: '+e.message; return; }
    }
    hint.textContent=''; file.value='';
  }
}

/* ================= MODAL ================= */
function openModal(title, body, save){
  document.getElementById('modalTitle').textContent=title;
  document.getElementById('modalBody').innerHTML=body;
  document.getElementById('modal').classList.add('on');
  document.getElementById('modalSave').onclick=save;
  document.getElementById('modalSave').textContent='Save';
  document.body.style.overflow='hidden';
}
function closeModal(){
  document.getElementById('modal').classList.remove('on');
  document.body.style.overflow='';
}
document.getElementById('modalCancel').onclick=closeModal;
async function withSaving(fn){
  const b=document.getElementById('modalSave'); b.disabled=true; const old=b.textContent; b.textContent='Saving...';
  try{ await fn(); }catch(e){ toast(e.message,'err'); } finally{ b.disabled=false; b.textContent=old; }
}
function confirmAction(msg){
  return new Promise(res=>{
    openModal('Please confirm', '<p style="margin:6px 0 0">'+esc(msg)+'</p>', async()=>{ closeModal(); res(true); });
    document.getElementById('modalSave').textContent='Yes, continue';
    const orig=document.getElementById('modalCancel').onclick;
    document.getElementById('modalCancel').onclick=()=>{ closeModal(); res(false); };
  });
}

<script>
/* ================= DASHBOARD ================= */
BUILDERS.dashboard = ()=>`
  <div class="phead"><div><h1>Dashboard</h1><div class="psub">Live overview of your store — real data from your database.</div></div></div>
  <div class="stats" id="dashStats"></div>
  <div class="card cardpad" style="margin-bottom:16px"><div class="ctitle">Orders by Status</div><div id="dashStatus"><span class="muted">Loading…</span></div></div>

    </div>
    <div id="dashOrders">${emptyBox('Loading…')}</div>
  </div>`;

async function loadDashboard(){
  const el=document.getElementById('dashStats');
  let a={};
  if(can('analytics.view')){ try{ a=await api('analytics.summary'); }catch(e){} }
  else {
    try{
      const [p,o]=await Promise.all([can('products.view')?api('products.list'):{products:[]}, can('orders.view')?api('orders.list'):{orders:[]}]);
      a={productsTotal:p.products.length, ordersTotal:o.orders.length, byStatus:{}, revenue:0, todayRevenue:0, customers:0};
      o.orders.forEach(x=>{ a.byStatus[x.status]=(a.byStatus[x.status]||0)+1; if(x.status!=='Cancelled'){ a.revenue+=Number(x.total||0); a.todayRevenue+=String(x.date||'').slice(0,10)===todayISO()?Number(x.total||0):0; }});
    }catch(e){}
  }
  const pend=(a.byStatus&&a.byStatus.Pending)||0;
  const cards=[
    {l:'Total Orders',n:a.ordersTotal??'—',i:'orders',c:'b'},
    {l:'Pending Orders',n:pend,i:'clock',c:'a'},
    {l:'Total Products',n:a.productsTotal??'—',i:'box',c:'p'},
    {l:'Revenue',n:(a.revenue!==undefined)?money(a.revenue):'—',i:'money',c:'g'}
  ];
  el.innerHTML=cards.map(x=>'<div class="scard"><div class="sic '+x.c+'">'+ic(x.i)+'</div><div><div class="slabel">'+x.l+'</div><div class="snum">'+x.n+'</div></div></div>').join('');
  const st=document.getElementById('dashStatus');
  const bs=a.byStatus||{};
  const max=Math.max(1,...Object.values(bs));
  st.innerHTML=Object.keys(bs).length?ORDER_STATUSES.filter(s=>bs[s]).map(s=>
    '<div class="barrow"><span class="k">'+s+'</span><div class="bartrack"><div class="barfill" style="width:'+Math.round(bs[s]/max*100)+'%"></div></div><span class="v">'+bs[s]+'</span></div>').join('')
    :'<span class="muted">No orders yet.</span>';
  const od=document.getElementById('dashOrders');
  if(can('orders.view')){
    try{
      const r=await api('orders.list');
      const rows=r.orders.slice(-8).reverse();
      od.innerHTML = rows.length? '<div class="ordcards">'+rows.map(o=>{
        const files=parseImages(o.files);
        const addr=addrLine(o);
        return '<div class="ordcard">'
          +'<div class="ordcard-top"><div><div class="ordcard-id">'+esc(o.id)+'</div><div class="ordcard-date">'+fmtDateTime(o.date)+'</div></div>'+statusPill(o.status)+'</div>'
          +'<div class="ordcard-body">'
            +'<div class="ordcard-info">'
              +'<div class="nm">'+esc(o.name||'—')+'</div>'
              +'<div class="muted2">'+esc(o.mobile||'')+(o.whatsapp&&o.whatsapp!==o.mobile?' · WA '+esc(o.whatsapp):'')+'</div>'
              +'<div class="muted2">'+esc(o.products||'')+(o.total?' · '+money(o.total):'')+'</div>'
              +(addr?'<div class="ordcard-addr">'+ic('pin')+'<span>'+esc(addr)+'</span></div>':'<div class="ordcard-addr muted2">No address on this order</div>')
            +'</div>'
            +'<div class="ordcard-imgs">'+(files.length?files.slice(0,3).map(u=>'<img src="'+esc(driveThumb(u,'w200'))+'" onclick="viewOrder(\''+esc(o.id)+'\')" onerror="imgErr(this)">').join(''):'<div class="ordcard-noimg">'+ic('image')+'</div>')+'</div>'
          +'</div>'
          +'<div class="ordcard-foot"><button class="ibtn v" onclick="viewOrder(\''+esc(o.id)+'\')" style="width:auto;padding:0 12px;gap:6px;display:inline-flex;align-items:center;font-size:12.5px;font-weight:600">'+ic('eye')+'Full details</button></div>'
        +'</div>';
      }).join('')+'</div>' : emptyBox('No orders yet.');
    }catch(e){ od.innerHTML=emptyBox(e.message); }
  } else od.innerHTML=emptyBox('No permission to view orders.');
  refreshBell();

/* ================= PRODUCTS ================= */
BUILDERS.products = ()=>`

    ${can('products.create')?'<button class="btn btn-p" id="addProdBtn">'+ic('plus')+'Add New Product</button>':''}</div>

      <div class="toolbar">
        <div class="tsearch"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="6.5"/><path d="M20 20l-4.2-4.2"/></svg>
          <input id="prodSearch" placeholder="Search products..."></div>
        <select id="prodCat"><option value="">All Categories</option></select>
        <select id="prodStatus"><option value="">All Status</option><option>Available</option><option>Unavailable</option></select>

function productStats(list){
  const act=list.filter(p=>(p.availability||'Available')==='Available').length;
  const today=list.filter(p=>String(p.createdAt||'').slice(0,10)===todayISO()).length;
  const el=document.getElementById('prodStats'); if(!el) return;
  el.innerHTML=[
    {l:'Total Products',n:list.length,i:'cube',c:'b'},
    {l:'Active',n:act,i:'check',c:'g'},
    {l:'Inactive',n:list.length-act,i:'clock',c:'a'},
    {l:'Today Added',n:today,i:'plus',c:'p'}
  ].map(x=>'<div class="scard"><div class="sic '+x.c+'">'+ic(x.i)+'</div><div><div class="slabel">'+x.l+'</div><div class="snum">'+x.n+'</div></div></div>').join('');

async function loadProducts(){
  if(!can('products.view')){ document.getElementById('prodTable').innerHTML=emptyBox('No permission: products.view'); return; }
  if(can('categories.view')){ try{ cache.categories=(await api('categories.list')).categories; }catch(e){} }
  cache.products=(await api('products.list')).products;
  const catSel=document.getElementById('prodCat');
  const cats=[...new Set(cache.products.map(p=>p.category).filter(Boolean))];
  catSel.innerHTML='<option value="">All Categories</option>'+cats.map(c=>'<option>'+esc(c)+'</option>').join('');
  document.getElementById('prodSearch').oninput=debounce(renderProducts,250);
  catSel.onchange=renderProducts;
  document.getElementById('prodStatus').onchange=renderProducts;
  const add=document.getElementById('addProdBtn');
  if(add) add.onclick=()=>openProductForm(null);
  renderProducts();
}

function renderProducts(){
  const list=cache.products||[];
  productStats(list);
  const q=(document.getElementById('prodSearch').value||'').toLowerCase();
  const cat=document.getElementById('prodCat').value, st=document.getElementById('prodStatus').value;
  let a=list.filter(p=>{
    if(cat && p.category!==cat) return false;
    if(st && (p.availability||'Available')!==st) return false;
    return !q || JSON.stringify(p).toLowerCase().includes(q);
  });
  a=a.slice().reverse();
  const pg=pageArr(a,'products',8);
  const t=document.getElementById('prodTable');
  if(!a.length){ t.innerHTML=emptyBox('No products match. Click "Add New Product" to create one.'); document.getElementById('prodPager').innerHTML=''; return; }

    pg.rows.map((p,i)=>{
      const imgs=parseImages(p.images);
      const thumb=imgs[0]?'<img class="tthumb" src="'+esc(imgs[0])+'" loading="lazy">':'<div class="tthumb"></div>';
      const n=(pg.cur-1)*pg.per+i+1;

        '</div></td></tr>';
    }).join('')+'</tbody></table>';

    (can('products.delete')?'<button class="btn btn-danger" onclick="deleteProduct(\''+esc(p.id)+'\')">'+ic('trash')+'Delete</button>':'')+
    '</div><div class="tips"><b>💡 Product Tips</b><p>Use high-quality images and clear dimensions to get better customer orders.</p></div></div>';
}

function productForm(p={}){
  const img=imageUploadWidget(parseImages(p.images));

    <div style="grid-column:1/-1"><label>Short Description</label><textarea id="f_desc">${esc(p.description||'')}</textarea></div>
    <div><label>Category</label><select id="f_cat">${cats.map(c=>'<option '+(p.category===c?'selected':'')+'>'+esc(c)+'</option>').join('')}</select></div>

    <div><label>Product Type</label><input id="f_type" value="${esc(p.type||'')}" placeholder="e.g. Backlit LED"></div>
    <div><label>Material</label><input id="f_material" value="${esc(p.material||'')}" placeholder="e.g. Acrylic + LED"></div>

      <option ${p.availability==='Unavailable'?'selected':''}>Unavailable</option></select></div>
    <div><label>Price (manual)</label><input id="f_price" value="${esc(p.price||'')}" placeholder="₹25,000 or Get a Quote"></div>
    <div><label>Price Note</label><input id="f_pnote" value="${esc(p.priceNote||'')}" placeholder="e.g. Starting from / per sq.ft"></div>
    <div><label>Tags (comma separated)</label><input id="f_tags" value="${esc(p.tags||'')}"></div>
    <div><label>Featured</label><select id="f_feat"><option value="" ${!p.featured?'selected':''}>No</option><option value="1" ${p.featured?'selected':''}>Yes</option></select></div>
  </div>
  ${img.html}
  <div class="msec">SEO</div>
  <div class="row2">
    <div><label>SEO Title</label><input id="f_seot" value="${esc(p.seoTitle||'')}"></div>
    <div><label>SEO Keywords</label><input id="f_seok" value="${esc(p.seoKeywords||'')}"></div>
    <div style="grid-column:1/-1"><label>SEO Description</label><textarea id="f_seod">${esc(p.seoDesc||'')}</textarea></div>
  </div>`;
}
function readProductForm(){
  const s=window.__pimg;
  return { name:val('f_name'), description:val('f_desc'), category:val('f_cat'), subcategory:val('f_sub'),
    type:val('f_type'), material:val('f_material'), size:val('f_size'), availability:val('f_avail'),
    price:val('f_price'), priceNote:val('f_pnote'), tags:val('f_tags'), featured:val('f_feat'),
    seoTitle:val('f_seot'), seoKeywords:val('f_seok'), seoDesc:val('f_seod'), images:s.images };
}
function val(id){ const el=document.getElementById(id); return el?el.value:''; }

function openProductForm(id){
  if(id && !can('products.edit')) return;
  if(!id && !can('products.create')) return;
  const p=id?(cache.products||[]).find(x=>String(x.id)===String(id)):{};
  openModal(id?'Edit Product':'Add New Product', productForm(p||{}), async()=>{
    await withSaving(async()=>{
      const data=readProductForm();
      if(!data.name.trim()) throw new Error('Product name is required.');
      if(id) await api('products.edit',{id,...data});
      else await api('products.create',data);
      closeModal(); toast(id?'Product updated':'Product created');
      S.selProd=id||S.selProd;
      if(S.sec==='products') await loadProducts();
    });
  });
}
async function duplicateProduct(id){
  const p=(cache.products||[]).find(x=>String(x.id)===String(id)); if(!p) return;
  await withSaving(async()=>{
    const data={...p}; delete data.id; delete data.createdAt; delete data.updatedAt;
    data.name=String(p.name||'')+' (Copy)';
    await api('products.create',data);
    toast('Product duplicated'); await loadProducts();
  });
}
async function deleteProduct(id){
  if(!await confirmAction('Delete this product? This cannot be undone.')) return;
  try{ await api('products.delete',{id}); if(String(S.selProd)===String(id)) S.selProd=null; toast('Product deleted'); await loadProducts(); }
  catch(e){ toast(e.message,'err'); }
}

/* ================= CATEGORIES ================= */
BUILDERS.categories = ()=>`
  <div class="phead"><div><h1>Categories</h1><div class="psub">Database-driven categories & subcategories used across your store.</div></div>
    ${can('categories.create')?'<button class="btn btn-p" id="addCatBtn">'+ic('plus')+'Add Category</button>':''}</div>
  <div class="card"><div class="tablewrap" id="catTable">${emptyBox('Loading…')}</div></div>`;

async function loadCategories(){
  if(!can('categories.view')){ document.getElementById('catTable').innerHTML=emptyBox('No permission: categories.view'); return; }
  cache.categories=(await api('categories.list')).categories;
  const b=document.getElementById('addCatBtn'); if(b) b.onclick=()=>openCategoryForm(null);
  renderCategories();
}
function renderCategories(){
  const list=(cache.categories||[]).slice().sort((a,b)=>(Number(a.sort)||0)-(Number(b.sort)||0));
  const mains=list.filter(c=>!c.parentId), subs=list.filter(c=>c.parentId);
  const t=document.getElementById('catTable');
  if(!list.length){ t.innerHTML=emptyBox('No categories yet. Add your first category.'); return; }
  const row=(c,depth)=>{ 
    const kids=subs.filter(s=>String(s.parentId)===String(c.id)).length;
    return '<tr><td>'+(depth?'<span style="padding-left:26px;color:#9db0c8">└─</span> ':'')+(c.image?'<img class="tthumb" style="display:inline-block;vertical-align:middle;margin-right:8px" src="'+esc(c.image)+'">':'')+'<span class="ttitle">'+esc(c.name)+'</span></td>'+
    '<td class="tsub" style="max-width:280px">'+esc(String(c.description||'').slice(0,70))+'</td>'+
    '<td>'+(depth?'<span class="pill off">Subcategory</span>':kids?'<span class="pill info">'+kids+' sub</span>':'<span class="pill off">Main</span>')+'</td>'+
    '<td>'+statusPill(c.status)+'</td>'+
    '<td><div class="act">'+
    (can('categories.edit')?'<button class="ibtn e" onclick="openCategoryForm(\''+esc(c.id)+'\')">'+ic('pen')+'</button>':'')+
    (can('categories.delete')?'<button class="ibtn d" onclick="deleteCategory(\''+esc(c.id)+'\')">'+ic('trash')+'</button>':'')+
    '</div></td></tr>'; };
  t.innerHTML='<table><thead><tr><th>Category</th><th>Description</th><th>Type</th><th>Status</th><th>Actions</th></tr></thead><tbody>'+
    mains.map(m=>row(m,0)+subs.filter(s=>String(s.parentId)===String(m.id)).map(s=>row(s,1)).join('')).join('')+
    subs.filter(s=>!mains.some(m=>m.id===s.parentId)).map(s=>row(s,0)).join('')+
    '</tbody></table>';
}
function openCategoryForm(id){
  const c=id?(cache.categories||[]).find(x=>String(x.id)===String(id)):{};
  const mains=(cache.categories||[]).filter(x=>!x.parentId && x.id!==id);
  const img=imageUploadWidget(c.image?[c.image]:[],'Category Image');
  window.__cimg=img.state;
  openModal(id?'Edit Category':'Add Category', `
    <label>Name *</label><input id="c_name" value="${esc(c.name||'')}">
    <label>Description</label><textarea id="c_desc">${esc(c.description||'')}</textarea>
    <div class="row2">
      <div><label>Parent (for subcategory)</label><select id="c_parent"><option value="">— Main Category —</option>${mains.map(m=>'<option value="'+esc(m.id)+'" '+(String(c.parentId)===String(m.id)?'selected':'')+'>'+esc(m.name)+'</option>').join('')}</select></div>
      <div><label>Sort Order</label><input id="c_sort" type="number" value="${esc(c.sort||0)}"></div>
      <div><label>Status</label><select id="c_status"><option ${(c.status||'ACTIVE')==='ACTIVE'?'selected':''}>ACTIVE</option><option ${c.status==='INACTIVE'?'selected':''}>INACTIVE</option></select></div>
    </div>
    ${img.html}`, async()=>{
    await withSaving(async()=>{
      const data={name:val('c_name'),description:val('c_desc'),parentId:val('c_parent'),sort:val('c_sort'),status:val('c_status'),image:window.__cimg.images[0]||''};
      if(!data.name.trim()) throw new Error('Category name is required.');
      if(id) await api('categories.edit',{id,...data});
      else await api('categories.create',data);
      closeModal(); toast(id?'Category updated':'Category created'); await loadCategories();
    });
  });
}
async function deleteCategory(id){
  if(!await confirmAction('Delete this category? Its subcategories will also be deleted.')) return;
  try{ const r=await api('categories.delete',{id}); toast('Deleted '+(r.removed||1)+' item(s)'); await loadCategories(); }
  catch(e){ toast(e.message,'err'); }
}

BUILDERS.designs = ()=>`
  <div class="phead"><div><h1>Product Base Design</h1><div class="psub">Manage your signage product base designs (Acrylic, LED, Vinyl, etc.)</div></div>
    ${can('designs.create')?'<button class="btn btn-p" id="addDesBtn">'+ic('plus')+'Add New Design</button>':''}</div>

  <div class="split">
    <div>
      <div class="toolbar">
        <div class="tsearch"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="6.5"/><path d="M20 20l-4.2-4.2"/></svg>
          <input id="desSearch" placeholder="Search designs..."></div>
        <select id="desCat"><option value="">All Categories</option></select>
        <select id="desStatus"><option value="">All Status</option><option value="ACTIVE">Active</option><option value="INACTIVE">Inactive</option></select>

    </div>
    <div class="preview" id="desPreview"><div class="card cardpad"><span class="muted">Select a design and click the eye icon to preview it here.</span></div></div>
  </div>`;

async function loadDesigns(){
  if(!can('designs.view')){ document.getElementById('desTable').innerHTML=emptyBox('No permission: designs.view'); return; }
  cache.designs=(await api('designs.list')).designs;
  if(can('categories.view')){ try{ cache.categories=(await api('categories.list')).categories; }catch(e){} }
  const cats=[...new Set(cache.designs.map(d=>d.category).filter(Boolean))];
  document.getElementById('desCat').innerHTML='<option value="">All Categories</option>'+cats.map(c=>'<option>'+esc(c)+'</option>').join('');
  document.getElementById('desSearch').oninput=debounce(renderDesigns,250);
  document.getElementById('desCat').onchange=renderDesigns;
  document.getElementById('desStatus').onchange=renderDesigns;
  const b=document.getElementById('addDesBtn'); if(b) b.onclick=()=>openDesignForm(null);
  renderDesigns();
}
function renderDesigns(){
  const list=cache.designs||[];
  const act=list.filter(d=>(d.status||'ACTIVE')==='ACTIVE').length;
  const today=list.filter(d=>String(d.createdAt||'').slice(0,10)===todayISO()).length;
  const st=document.getElementById('desStats');
  st.innerHTML=[
    {l:'Total Designs',n:list.length,i:'cube',c:'b'},
    {l:'Active',n:act,i:'check',c:'g'},
    {l:'Inactive',n:list.length-act,i:'clock',c:'a'},
    {l:'Today Added',n:today,i:'plus',c:'p'}
  ].map(x=>'<div class="scard"><div class="sic '+x.c+'">'+ic(x.i)+'</div><div><div class="slabel">'+x.l+'</div><div class="snum">'+x.n+'</div></div></div>').join('');
  const q=(document.getElementById('desSearch').value||'').toLowerCase();
  const cat=document.getElementById('desCat').value, s=document.getElementById('desStatus').value;
  let a=list.filter(d=>{
    if(cat && d.category!==cat) return false;
    if(s && (d.status||'ACTIVE')!==s) return false;
    return !q || JSON.stringify(d).toLowerCase().includes(q);
  }).slice().reverse();
  const pg=pageArr(a,'designs',8);
  const t=document.getElementById('desTable');
  if(!a.length){ t.innerHTML=emptyBox('No designs yet. Click "Add New Design" to create your first one.'); document.getElementById('desPager').innerHTML=''; return; }
  t.innerHTML='<table><thead><tr><th>#</th><th>Image</th><th>Title</th><th>Category</th><th>Status</th><th>Actions</th></tr></thead><tbody>'+
    pg.rows.map((d,i)=>{
      const imgs=parseImages(d.images); const im=d.image||imgs[0];
      const n=(pg.cur-1)*pg.per+i+1;
      return '<tr><td class="muted">'+n+'</td><td>'+(im?'<img class="tthumb" src="'+esc(im)+'" loading="lazy">':'<div class="tthumb"></div>')+'</td>'+
      '<td><div class="ttitle">'+esc(d.name)+'</div><div class="tsub">'+esc(String(d.description||'').slice(0,60))+'</div></td>'+
      '<td>'+catPill(d.category)+'</td><td>'+statusPill(d.status||'ACTIVE')+'</td>'+
      '<td><div class="act"><button class="ibtn v" onclick="previewDesign(\''+esc(d.id)+'\')">'+ic('eye')+'</button>'+
      (can('designs.edit')?'<button class="ibtn e" onclick="openDesignForm(\''+esc(d.id)+'\')">'+ic('pen')+'</button>':'')+
      (can('designs.delete')?'<button class="ibtn d" onclick="deleteDesign(\''+esc(d.id)+'\')">'+ic('trash')+'</button>':'')+
      '</div></td></tr>';
    }).join('')+'</tbody></table>';
  document.getElementById('desPager').innerHTML=pagerHtml(pg,'designs');
  if(S.selDesign) previewDesign(S.selDesign,true);
}
function previewDesign(id){
  S.selDesign=id;
  const d=(cache.designs||[]).find(x=>String(x.id)===String(id));
  const el=document.getElementById('desPreview'); if(!el||!d) return;
  const imgs=parseImages(d.images); const im=d.image||imgs[0];
  el.innerHTML='<div class="card cardpad"><div class="ctitle">Design Preview</div>'+
    (im?'<img class="pv-img" src="'+esc(im)+'">':'<div class="pv-img"></div>')+
    '<div class="pv-title"><span>'+esc(d.name)+'</span>'+statusPill(d.status||'ACTIVE')+'</div>'+
    '<div class="pv-meta">'+
    '<div class="pv-row">'+ic('layers')+'<span class="k">Category</span><span class="v">'+esc(d.category||'—')+'</span></div>'+
    (d.designType?'<div class="pv-row">'+ic('tag')+'<span class="k">Design Type</span><span class="v">'+esc(d.designType)+'</span></div>':'')+
    (d.sizeRange?'<div class="pv-row">'+ic('box')+'<span class="k">Size Range</span><span class="v">'+esc(d.sizeRange)+'</span></div>':'')+
    (d.material?'<div class="pv-row">'+ic('cube')+'<span class="k">Material</span><span class="v">'+esc(d.material)+'</span></div>':'')+
    (d.price?'<div class="pv-row">'+ic('money')+'<span class="k">Price</span><span class="v">'+esc(d.price)+'</span></div>':'')+
    '</div><hr class="hr"><div class="ctitle">Quick Actions</div><div class="qa">'+
    (can('designs.edit')?'<button class="btn btn-p" onclick="openDesignForm(\''+esc(d.id)+'\')">'+ic('pen')+'Edit Design</button>':'')+
    (can('designs.create')?'<button class="btn btn-o" onclick="duplicateDesign(\''+esc(d.id)+'\')">'+ic('cube')+'Duplicate</button>':'')+
    (can('designs.delete')?'<button class="btn btn-danger" onclick="deleteDesign(\''+esc(d.id)+'\')">'+ic('trash')+'Delete</button>':'')+
    '</div><div class="tips"><b>💡 Design Tips</b><p>Use high-quality images and clear dimensions to get better customer orders.</p></div></div>';
}
function openDesignForm(id){
  const d=id?(cache.designs||[]).find(x=>String(x.id)===String(id)):{};
  const cats=(cache.categories&&cache.categories.length)?cache.categories.map(c=>c.name):DEFAULT_CATEGORIES;
  const img=imageUploadWidget(parseImages(d.images));
  window.__dimg=img.state;
  openModal(id?'Edit Base Design':'Add New Design', `
    <label>Design Name *</label><input id="d_name" value="${esc(d.name||'')}">
    <label>Description</label><textarea id="d_desc">${esc(d.description||'')}</textarea>
    <div class="row2">
      <div><label>Category</label><select id="d_cat">${cats.map(c=>'<option '+(d.category===c?'selected':'')+'>'+esc(c)+'</option>').join('')}</select></div>
      <div><label>Subcategory</label><input id="d_sub" value="${esc(d.subcategory||'')}"></div>
      <div><label>Design Type</label><input id="d_type" value="${esc(d.designType||'')}" placeholder="e.g. Backlit LED"></div>
      <div><label>Material</label><input id="d_mat" value="${esc(d.material||'')}" placeholder="e.g. Acrylic + LED"></div>
      <div><label>Size Range</label><input id="d_size" value="${esc(d.sizeRange||'')}" placeholder="e.g. Custom (Any Size)"></div>
      <div><label>Price (optional)</label><input id="d_price" value="${esc(d.price||'')}" placeholder="₹ or Get a Quote"></div>
      <div><label>Status</label><select id="d_status"><option ${(d.status||'ACTIVE')==='ACTIVE'?'selected':''}>ACTIVE</option><option ${d.status==='INACTIVE'?'selected':''}>INACTIVE</option></select></div>
    </div>
    ${img.html}`, async()=>{
    await withSaving(async()=>{
      const data={name:val('d_name'),description:val('d_desc'),category:val('d_cat'),subcategory:val('d_sub'),
        designType:val('d_type'),material:val('d_mat'),sizeRange:val('d_size'),price:val('d_price'),
        status:val('d_status'),images:window.__dimg.images};
      if(!data.name.trim()) throw new Error('Design name is required.');
      if(id) await api('designs.edit',{id,...data});
      else await api('designs.create',data);
      closeModal(); toast(id?'Design updated':'Design created'); await loadDesigns();
    });
  });
}
async function duplicateDesign(id){
  const d=(cache.designs||[]).find(x=>String(x.id)===String(id)); if(!d) return;
  await withSaving(async()=>{
    const data={...d}; delete data.id; delete data.createdAt; delete data.updatedAt;
    data.name=String(d.name||'')+' (Copy)';
    await api('designs.create',data);
    toast('Design duplicated'); await loadDesigns();
  });
}
async function deleteDesign(id){
  if(!await confirmAction('Delete this base design?')) return;
  try{ await api('designs.delete',{id}); if(S.selDesign===id) S.selDesign=null; toast('Design deleted'); await loadDesigns(); }
  catch(e){ toast(e.message,'err'); }
}
</script>
<script>
/* ================= ORDERS + QUOTES ================= */
BUILDERS.orders = ()=>`
  <div class="phead"><div><h1>Orders</h1><div class="psub">Real orders from your database.</div></div></div>
  <div class="tabs">
    <button class="tab ${S.ordersTab==='orders'?'on':''}" onclick="S.ordersTab='orders';go2('orders')">Orders</button>

  <div id="ordersBody">${emptyBox('Loading…')}</div>`;

async function loadOrders(){
  if(S.ordersTab==='quotes') return loadQuotes();
  if(!can('orders.view')){ document.getElementById('ordersBody').innerHTML=emptyBox('No permission: orders.view'); return; }
  cache.orders=(await api('orders.list')).orders;
  buildNav();
  const body=document.getElementById('ordersBody');
  body.innerHTML=`
    <div class="stats" id="ordStats"></div>
    <div class="toolbar">
      <div class="tsearch"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="6.5"/><path d="M20 20l-4.2-4.2"/></svg>
        <input id="ordSearch" placeholder="Search order / customer / phone"></div>
      <select id="ordStatus">${'<option value="">All Status</option>'+ORDER_STATUSES.map(s=>'<option>'+s+'</option>').join('')}</select>
    </div>
    <div class="card"><div class="tablewrap" id="ordTable"></div><div id="ordPager"></div></div>`;
  const all=cache.orders;
  const cnt=s=>all.filter(o=>o.status===s).length;
  document.getElementById('ordStats').innerHTML=[
    {l:'Total Orders',n:all.length,i:'orders',c:'b'},
    {l:'Pending',n:cnt('Pending'),i:'clock',c:'a'},
    {l:'Delivered',n:cnt('Delivered'),i:'check',c:'g'},
    {l:'Revenue',n:money(all.filter(o=>o.status!=='Cancelled').reduce((a,o)=>a+Number(o.total||0),0)),i:'money',c:'p'}
  ].map(x=>'<div class="scard"><div class="sic '+x.c+'">'+ic(x.i)+'</div><div><div class="slabel">'+x.l+'</div><div class="snum">'+x.n+'</div></div></div>').join('');
  document.getElementById('ordSearch').oninput=debounce(renderOrders,250);
  document.getElementById('ordStatus').onchange=renderOrders;
  renderOrders();
}
function renderOrders(){
  const q=(document.getElementById('ordSearch').value||'').toLowerCase();
  const s=document.getElementById('ordStatus').value;
  let a=(cache.orders||[]).filter(o=>(!s||o.status===s)&&(!q||JSON.stringify(o).toLowerCase().includes(q))).slice().reverse();
  const pg=pageArr(a,'orders',10);
  const t=document.getElementById('ordTable');
  if(!a.length){ t.innerHTML=emptyBox('No orders match.'); document.getElementById('ordPager').innerHTML=''; return; }
  t.innerHTML='<table><thead><tr><th>Image</th><th>Order</th><th>Date</th><th>Customer</th><th>Phone</th><th>Products</th><th>Total</th><th>Status</th><th>Actions</th></tr></thead><tbody>'+
    pg.rows.map(o=>'<tr><td>'+(parseImages(o.files)[0]?'<img src="'+esc((function(u){var m=String(u||'').match(/\/d\/([a-zA-Z0-9_-]+)/);return m?'https://drive.google.com/thumbnail?id='+m[1]+'&sz=w200':u;})(parseImages(o.files)[0]))+'" style="width:50px;height:50px;object-fit:cover;border-radius:8px;cursor:zoom-in" onclick="showImage(\''+String(parseImages(o.files)[0]).replace(/'/g,"\\'")+'\')">':'<div style="width:50px;height:50px;border-radius:8px;background:#e8eef6"></div>')+'</td><td class="ttitle">'+esc(o.id)+'</td><td class="muted">'+fmtDateTime(o.date)+'</td>'+
      '<td>'+esc(o.name||'')+'</td><td>'+esc(o.mobile||'')+'</td><td>'+esc(o.products||'')+'</td>'+
      '<td class="ttitle">'+(o.total?money(o.total):'—')+'</td>'+
      '<td>'+statusPill(o.status)+'</td>'+
      '<td><div class="act"><button class="ibtn v" onclick="viewOrder(\''+esc(o.id)+'\')">'+ic('eye')+'</button>'+
      (can('orders.delete')?'<button class="ibtn d" onclick="deleteOrder(\''+esc(o.id)+'\')">'+ic('trash')+'</button>':'')+
      '</div></td></tr>').join('')+'</tbody></table>';

  ].map(x=>'<div class="scard"><div class="sic '+x.c+'">'+ic(x.i)+'</div><div><div class="slabel">'+x.l+'</div><div class="snum">'+x.n+'</div></div></div>').join('')+
  '<div class="scard"><div class="sic t">'+ic('users')+'</div><div><div class="slabel">Customers</div><div class="snum">'+a.customers+'</div></div></div>'+
  '<div class="scard"><div class="sic a">'+ic('star')+'</div><div><div class="slabel">Avg Rating ('+a.reviewsApproved+' approved)</div><div class="snum">'+(a.avgRating?a.avgRating.toFixed(1)+'★':'—')+'</div></div></div>'+

  '<div class="scard"><div class="sic r">'+ic('filter')+'</div><div><div class="slabel">New Quotes</div><div class="snum">'+a.quotesNew+'</div></div></div>';
  const bs=a.byStatus||{}, max=Math.max(1,...Object.values(bs));
  document.getElementById('anaStatus').innerHTML=Object.keys(bs).length?
    ORDER_STATUSES.filter(s=>bs[s]).map(s=>'<div class="barrow"><span class="k">'+s+'</span><div class="bartrack"><div class="barfill" style="width:'+Math.round(bs[s]/max*100)+'%"></div></div><span class="v">'+bs[s]+'</span></div>').join('')
    :'<span class="muted">No orders yet.</span>';
  drawVisitChart(a.stats||[]);
}
function drawVisitChart(stats){
  const cv=document.getElementById('visitChart');
  const total=(stats||[]).reduce((a,s)=>a+Number(s.visits||0),0);
  if(!stats.length || !total){ cv.style.display='none'; document.getElementById('chartEmpty').innerHTML='<div class="empty">'+ic('chart')+'<div>No visit data yet. Add the tracking snippet to your website (see Settings).</div></div>'; return; }
  document.getElementById('chartEmpty').innerHTML='';
  const dpr=window.devicePixelRatio||1;
  const W=cv.clientWidth, H=220;
  cv.width=W*dpr; cv.height=H*dpr;
  const ctx=cv.getContext('2d'); ctx.scale(dpr,dpr);
  const max=Math.max(...stats.map(s=>Number(s.visits||0)),1);
  const pad=30, bw=(W-pad-10)/stats.length;
  ctx.strokeStyle='#e6ecf4'; ctx.fillStyle='#7185a1'; ctx.font='10px Inter';
  for(let i=0;i<=4;i++){ const y=10+(H-40)*i/4; ctx.beginPath(); ctx.moveTo(pad,y); ctx.lineTo(W-5,y); ctx.stroke(); ctx.fillText(String(Math.round(max*(4-i)/4)),4,y+3); }
  stats.forEach((s,i)=>{
    const v=Number(s.visits||0), h=(H-50)*(v/max);
    const x=pad+i*bw+bw*0.15, y=H-30-h;
    ctx.fillStyle='#2563eb';
    ctx.beginPath(); ctx.roundRect(x,y,bw*0.7,h||2,4); ctx.fill();
    ctx.fillStyle='#7185a1';
    ctx.fillText(String(s.date||'').slice(5),x,H-14);
  });
}

function notifMeta(n){

<script>
/* =====================================================================
   PERFORMANCE + RELIABILITY LAYER (loaded after the panel code)
   - stale-while-revalidate cache: pages open instantly, data refreshes in background
   - parallel requests, no refetch on pagination / filters
   - product <-> category / subcategory linked to the Categories manager
   - category rename / move keeps products in sync (website follows automatically)
   - dashboard / products buttons always find their record
   - customer image viewer: small first, zoom, back button
   ===================================================================== */
(function(){
'use strict';
const sid = v => String(v==null ? '' : v);
const findBy = (list,id) => (list||[]).find(x => sid(x.id)===sid(id));
const isOff = c => String(c.status||'ACTIVE').toUpperCase()==='INACTIVE';
const bySort = (a,b) => (Number(a.sort)||0)-(Number(b.sort)||0) || String(a.name).localeCompare(String(b.name));
const $id = id => document.getElementById(id);

/* ---------- session cache (cleared on login / logout) ---------- */
const SWR = 'sp_swr:';
function swrGet(k){ try{ const v=sessionStorage.getItem(SWR+k); return v?JSON.parse(v):null; }catch(e){ return null; } }
function swrSet(k,d){ try{ sessionStorage.setItem(SWR+k,JSON.stringify(d)); }catch(e){ try{ sessionStorage.removeItem(SWR+k); }catch(_){} } }
function swrClear(){ try{ Object.keys(sessionStorage).filter(k=>k.indexOf(SWR)===0).forEach(k=>sessionStorage.removeItem(k)); }catch(e){} }
window.swrGet=swrGet; window.swrSet=swrSet;
const lf=$id('loginForm'); if(lf) lf.addEventListener('submit',swrClear,true);
const lo=$id('logout'); if(lo) lo.onclick=async()=>{ try{ await api('auth.logout'); }catch(e){} swrClear(); sessionStorage.removeItem('sp_admin_session'); location.reload(); };

/* ---------- api: timeout + one quiet retry for read-only calls ---------- */
async function apiOnce(action,payload,timeout){
  const ctrl=new AbortController(); const to=setTimeout(()=>ctrl.abort(),timeout||60000);
  try{
    const r=await fetch(ADMIN_API_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({action,token:sessionToken,payload}),signal:ctrl.signal});
    const text=await r.text(); let j;
    try{ j=JSON.parse(text); }catch(e){ throw new Error('Unexpected server response.'); }
    if(!j.ok){ const er=new Error(j.error||'Request failed'); er.fatal=true; throw er; }
    return j;
  }catch(e){
    if(e && e.name==='AbortError') throw new Error('Server is taking too long. Please try again.');
    throw e;
  }finally{ clearTimeout(to); }
}
window.api=async function api(action,payload={}){
  const readOnly=/\.(list|list_public|summary|unread_count)$/.test(action);
  for(let i=0;;i++){
    try{ return await apiOnce(action,payload); }
    catch(e){ if(e.fatal || !readOnly || i>=1) throw e; await new Promise(r=>setTimeout(r,700)); }
  }
};

/* ---------- image upload: shrink photos before sending (much faster) ---------- */
function readAsDataURL(f){ return new Promise((res,rej)=>{ const r=new FileReader(); r.onload=()=>res(r.result); r.onerror=rej; r.readAsDataURL(f); }); }
async function shrink(file){
  const raw=await readAsDataURL(file);
  if(!/^image\/(jpeg|png|webp)$/i.test(file.type)) return {data:raw,name:file.name};
  try{
    let bmp;
    try{ bmp=await createImageBitmap(file,{imageOrientation:'from-image'}); }
    catch(e){ bmp=await new Promise((res,rej)=>{ const im=new Image(); im.onload=()=>res(im); im.onerror=rej; im.src=raw; }); }
    const w0=bmp.width||bmp.naturalWidth, h0=bmp.height||bmp.naturalHeight, MAX=1600;
    const k=Math.min(1,MAX/Math.max(w0,h0));
    if(k===1 && file.size<350*1024) return {data:raw,name:file.name};
    const cv=document.createElement('canvas'); cv.width=Math.round(w0*k); cv.height=Math.round(h0*k);
    const cx=cv.getContext('2d'); cx.fillStyle='#fff'; cx.fillRect(0,0,cv.width,cv.height); cx.drawImage(bmp,0,0,cv.width,cv.height);
    const out=cv.toDataURL('image/jpeg',0.84);
    if(out.length<raw.length) return {data:out,name:file.name.replace(/\.[^.]+$/,'')+'.jpg'};
  }catch(e){}
  return {data:raw,name:file.name};
}
window.wireImageWidget=function(id,state){
  const drop=$id(id+'_drop'); if(!drop) return;
  const file=$id(id+'_file'), preview=$id(id+'_preview'), hint=$id(id+'_hint');
  function render(){
    preview.innerHTML=state.images.map((u,i)=>'<div class="ph"><img src="'+esc(u)+'">'+(i===0?'<span style="position:absolute;bottom:3px;left:3px;background:#2563eb;color:#fff;font-size:9px;padding:1px 6px;border-radius:6px">MAIN</span>':'')+'<button type="button" class="rm" data-i="'+i+'">×</button></div>').join('');
    preview.querySelectorAll('.rm').forEach(b=>b.onclick=()=>{ state.images.splice(+b.dataset.i,1); render(); });
  }
  render();
  drop.onclick=()=>file.click();
  drop.ondragover=e=>{e.preventDefault();drop.classList.add('drag');};
  drop.ondragleave=()=>drop.classList.remove('drag');
  drop.ondrop=e=>{e.preventDefault();drop.classList.remove('drag');handle(e.dataTransfer.files);};
  file.onchange=()=>handle(file.files);
  async function handle(fl){
    const files=Array.from(fl||[]); if(!files.length) return;
    let n=0;
    for(const f of files){
      n++; hint.textContent='Uploading photo '+n+' of '+files.length+'…';
      try{
        const s=await shrink(f);
        const resp=await api('media.upload',{data:s.data,filename:s.name});
        state.images.push(resp.url); render();
      }catch(e){ hint.textContent='Upload failed: '+e.message; file.value=''; return; }
    }
    hint.textContent=''; file.value='';
  }
};

        +'<div class="ordcard-body"><div class="ordcard-info"><div class="nm">'+esc(o.name||'—')+'</div>'
        +'<div class="muted2">'+esc(o.mobile||'')+(o.whatsapp&&o.whatsapp!==o.mobile?' · WA '+esc(o.whatsapp):'')+'</div>'
        +'<div class="muted2">'+esc(o.products||'')+(o.total?' · '+money(o.total):'')+'</div>'
        +(addr?'<div class="ordcard-addr">'+ic('pin')+'<span>'+esc(addr)+'</span></div>':'<div class="ordcard-addr muted2">No address on this order</div>')+'</div>'
        +'<div class="ordcard-imgs">'+(files.length?files.slice(0,3).map(u=>'<img data-act="vieworder" data-id="'+id+'" src="'+esc(driveThumb(u,'w200'))+'" onerror="imgErr(this)">').join(''):'<div class="ordcard-noimg">'+ic('image')+'</div>')+'</div></div>'
        +'<div class="ordcard-foot"><button type="button" class="ibtn v" data-act="vieworder" data-id="'+id+'" style="width:auto;padding:0 12px;gap:6px;display:inline-flex;align-items:center;font-size:12.5px;font-weight:600">'+ic('eye')+'Full details</button></div></div>';
    }).join('')+'</div>':emptyBox('No orders yet.');
  }
  paintStats(); paintOrders();
  const jobs=[];
  if(can('analytics.view')) jobs.push(api('analytics.summary').then(r=>{ st.a=r; swrSet('analytics.summary',r); paintStats(); }).catch(()=>{}));

/* keep products pointing at the right category names after rename / move */
async function cascadeCategoryChange(old,nw){
  const newName=nw.name.trim(), wasSub=!!old.parentId, nowSub=!!nw.parentId;
  const newParent=nowSub?findBy(cache.categories,nw.parentId):null;
  if(old.name===newName && sid(old.parentId||'')===sid(nw.parentId||'')) return;
  try{ await ensureProducts(); }catch(e){ return; }
  const jobs=[];
  (cache.products||[]).forEach(p=>{
    let cat=p.category||'', sub=p.subcategory||'', hit=false;
    if(!wasSub && !nowSub){ if(cat===old.name){ cat=newName; hit=true; } }
    else if(wasSub && nowSub){ if(sub===old.name){ sub=newName; cat=newParent?newParent.name:cat; hit=true; } }
    else if(wasSub && !nowSub){ if(sub===old.name){ cat=newName; sub=''; hit=true; } }
    else if(!wasSub && nowSub){ if(cat===old.name){ cat=newParent?newParent.name:cat; sub=newName; hit=true; } }
    if(hit && (cat!==p.category || sub!==(p.subcategory||''))) jobs.push({p,cat,sub});
  });
  const btn=$id('modalSave');
  for(let i=0;i<jobs.length;i++){
    if(btn) btn.textContent='Updating products '+(i+1)+'/'+jobs.length+'…';
    await api('products.edit',prodPayload(jobs[i].p,{category:jobs[i].cat,subcategory:jobs[i].sub}));
    jobs[i].p.category=jobs[i].cat; jobs[i].p.subcategory=jobs[i].sub;
  }
  if(jobs.length){ swrSet('products.list',{ok:true,products:cache.products}); toast(jobs.length+' product(s) updated to the new category'); }
}
window.deleteCategory=async function(id){
  await ensureCategories(); try{ await ensureProducts(); }catch(e){}
  const c=findBy(cache.categories,id); if(!c) return;
  const kids=(cache.categories||[]).filter(x=>sid(x.parentId)===sid(id));
  const names=[c.name].concat(kids.map(k=>k.name));
  const used=(cache.products||[]).filter(p=>names.indexOf(p.category)>-1||names.indexOf(p.subcategory)>-1).length;
  const msg='Delete "'+c.name+'"'+(kids.length?' and its '+kids.length+' subcategor'+(kids.length>1?'ies':'y'):'')+'?'+(used?' '+used+' product(s) use it; they stay in Products but will no longer appear under this category on the website.':'');
  if(!await confirmAction(msg)) return;
  try{ const r=await api('categories.delete',{id}); toast('Deleted '+(r.removed||1)+' item(s)'); await loadCategories(); }
  catch(e){ toast(e.message,'err'); }
};
async function moveCat(id,dir){
  const list=cache.categories||[], c=findBy(list,id); if(!c) return;
  const sibs=list.filter(x=>sid(x.parentId)===sid(c.parentId)).sort(bySort);
  const i=sibs.findIndex(x=>sid(x.id)===sid(id)), j=i+dir; if(j<0||j>=sibs.length) return;
  const order=sibs.slice(); const tmp=order[i]; order[i]=order[j]; order[j]=tmp;
  const ups=[]; order.forEach((x,k)=>{ const ns=(k+1)*10; if(Number(x.sort)!==ns) ups.push({x,ns}); });
  ups.forEach(u=>{ u.x.sort=u.ns; }); renderCategories();
  try{ for(const u of ups) await api('categories.edit',catPayload(u.x)); swrSet('categories.list',{ok:true,categories:cache.categories}); toast('Order updated'); }
  catch(e){ toast(e.message,'err'); await loadCategories(); }
}

/* =====================================================================
   ONE click handler for every action button (survives re-renders)
   ===================================================================== */
document.addEventListener('click',function(e){
  const b=e.target.closest && e.target.closest('[data-act]'); if(!b || b.disabled) return;
  const act=b.getAttribute('data-act'), id=b.getAttribute('data-id');
  const inModal=!!b.closest('#modal');
  if(act==='vieworder'){ e.preventDefault(); viewOrder(id); }
  else if(act==='prodprev'){ previewProduct(id); }
  else if(act==='prodedit'){ if(inModal) closeModal(); openProductForm(id); }
  else if(act==='proddel'){ deleteProduct(id); }
  else if(act==='proddup'){ duplicateProduct(id); }
  else if(act==='catedit'){ openCategoryForm(id); }
  else if(act==='catsub'){ openCategoryForm(null,id); }
  else if(act==='catdel'){ deleteCategory(id); }
  else if(act==='catup'){ moveCat(id,-1); }
  else if(act==='catdown'){ moveCat(id,1); }
});

window.showImage=function(url){
  if(!url) return;
  url=String(url);
  const m=url.match(/\/d\/([a-zA-Z0-9_-]+)/);
  const small=m?'https://drive.google.com/thumbnail?id='+m[1]+'&sz=w900':url;
  const big=m?'https://drive.google.com/thumbnail?id='+m[1]+'&sz=w2400':url;
  const ov=document.createElement('div'); ov.className='imgv';
  ov.innerHTML='<div class="imgv-bar"><button type="button" class="imgv-back">‹ Back</button><div class="imgv-title">Customer image</div><div class="imgv-tools"><button type="button" data-z="out" aria-label="Zoom out">−</button><span class="imgv-pct">100%</span><button type="button" data-z="in" aria-label="Zoom in">+</button></div></div>'+
    '<div class="imgv-stage"><img class="imgv-img" alt="" draggable="false"></div>'+
    '<div class="imgv-foot"><span>Pinch, double-tap or use + / − to zoom</span><a href="'+esc(big)+'" target="_blank" rel="noopener">Open original</a></div>';
  document.body.appendChild(ov); document.body.style.overflow='hidden';
  const img=ov.querySelector('.imgv-img'), stage=ov.querySelector('.imgv-stage'), pct=ov.querySelector('.imgv-pct');
  img.src=small;
  let sc=1,tx=0,ty=0,bigLoaded=false,pushed=false;
  function apply(){ img.style.transform='translate('+tx+'px,'+ty+'px) scale('+sc+')'; pct.textContent=Math.round(sc*100)+'%'; img.classList.toggle('zoomed',sc>1.02); }
  function clampPan(){
    if(sc<=1){ tx=0; ty=0; return; }
    const mx=Math.max(0,(img.offsetWidth*sc-stage.clientWidth)/2+40), my=Math.max(0,(img.offsetHeight*sc-stage.clientHeight)/2+40);
    tx=Math.max(-mx,Math.min(mx,tx)); ty=Math.max(-my,Math.min(my,ty));
  }
  function loadBig(){ if(bigLoaded||big===small) return; bigLoaded=true; const t=new Image(); t.onload=()=>{ img.src=big; }; t.src=big; }
  function setScale(ns,cx,cy){
    ns=Math.max(1,Math.min(6,ns)); const k=ns/sc; tx=cx-(cx-tx)*k; ty=cy-(cy-ty)*k; sc=ns; clampPan(); apply(); if(sc>1.3) loadBig();
  }
  const ptrs=new Map(); let lastDist=0,lastTap=0,moved=false;
  const dist=()=>{ const a=Array.from(ptrs.values()); return Math.hypot(a[0].x-a[1].x,a[0].y-a[1].y); };
  const rel=(x,y)=>{ const r=stage.getBoundingClientRect(); return {x:x-r.left-r.width/2,y:y-r.top-r.height/2}; };
  stage.addEventListener('pointerdown',e=>{ try{ stage.setPointerCapture(e.pointerId); }catch(_){} ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY}); if(ptrs.size===2) lastDist=dist(); moved=false; });
  stage.addEventListener('pointermove',e=>{
    const p=ptrs.get(e.pointerId); if(!p) return;
    const dx=e.clientX-p.x, dy=e.clientY-p.y; ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});
    if(ptrs.size===2){
      const d=dist(), a=Array.from(ptrs.values()), c=rel((a[0].x+a[1].x)/2,(a[0].y+a[1].y)/2);
      if(lastDist) setScale(sc*d/lastDist,c.x,c.y); lastDist=d; moved=true;
    }else if(ptrs.size===1 && sc>1){ tx+=dx; ty+=dy; clampPan(); apply(); if(Math.abs(dx)+Math.abs(dy)>2) moved=true; }
  });
  function endPtr(e){ if(!ptrs.has(e.pointerId)) return; ptrs.delete(e.pointerId); if(ptrs.size<2) lastDist=0; }
  stage.addEventListener('pointerup',e=>{
    const single=ptrs.size===1; endPtr(e);
    if(single && !moved){
      const now=Date.now();
      if(now-lastTap<320){ const c=rel(e.clientX,e.clientY); if(sc>1.05){ sc=1; tx=0; ty=0; apply(); } else setScale(2.5,c.x,c.y); lastTap=0; }
      else lastTap=now;
    }
  });
  stage.addEventListener('pointercancel',endPtr);
  stage.addEventListener('wheel',e=>{ e.preventDefault(); const c=rel(e.clientX,e.clientY); setScale(sc*(e.deltaY<0?1.18:1/1.18),c.x,c.y); },{passive:false});
  ov.querySelector('[data-z="in"]').onclick=()=>setScale(sc*1.4,0,0);
  ov.querySelector('[data-z="out"]').onclick=()=>setScale(sc/1.4,0,0);
  function close(fromPop){
    document.removeEventListener('keydown',onKey); window.removeEventListener('popstate',onPop);
    ov.remove(); document.body.style.overflow=$id('modal').classList.contains('on')?'hidden':'';
    if(!fromPop && pushed){ pushed=false; try{ history.back(); }catch(_){} }
  }
  function onPop(){ pushed=false; close(true); }
  function onKey(e){ if(e.key==='Escape') close(false); }
  ov.querySelector('.imgv-back').onclick=()=>close(false);
  document.addEventListener('keydown',onKey); window.addEventListener('popstate',onPop);
  try{ history.pushState({imgv:1},''); pushed=true; }catch(_){}
  apply();
};
})();
</script>
